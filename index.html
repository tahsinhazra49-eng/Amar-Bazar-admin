<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>এডমিন প্যানেল - আমাদের বাজার</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap">

<style>
:root{
  --ink:#0b1020;--ink-2:#3a4250;--muted:#667085;--line:#e8eaef;
  --nav:#070b16;--nav-2:#121a2c;--bar:#0e1526;
  --yellow:#fbb614;--yellow-d:#eba400;
  --red:#e11d48;--red-soft:#ffe4e9;
  --green:#16a34a;--green-soft:#e7f8ee;
  --blue:#2563eb;--blue-soft:#e8f0fe;
  --soft:#f3f4f6;--card:#fff;
  --font:'Poppins','Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:#f5f6f8;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none !important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;border:1.5px solid transparent;font-weight:600;font-size:14px;white-space:nowrap;transition:.15s}
.btn:active{transform:translateY(1px)}
.btn-yellow{background:var(--yellow);color:var(--ink)}
.btn-yellow:hover{background:var(--yellow-d)}
.btn-dark{background:var(--nav);color:#fff}
.btn-dark:hover{background:#1a2238}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-outline:hover{border-color:#b7bdc9}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:#ffd2dc}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* ---------- login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,#1b2440,#070b16 65%);padding:20px}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:36px 30px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.login-mark{width:52px;height:52px;border-radius:14px;background:var(--yellow);display:grid;place-items:center;font-size:26px;margin-bottom:16px}
.login-card h1{font-size:21px;font-weight:800}
.login-card p.sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.field span{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,.select,.textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14.5px;background:#fff}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink);outline:none}
.textarea{resize:vertical;min-height:70px}
#loginForm .btn{width:100%;margin-top:20px;padding:13px}
.login-error{margin-top:14px;background:var(--red-soft);color:var(--red);font-size:13px;font-weight:600;padding:10px 12px;border-radius:8px}
.login-forgot{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--muted);text-decoration:underline}
.login-forgot:hover{color:var(--ink)}

/* ---------- app shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:236px;flex:none;background:var(--nav);color:#c7ccda;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-brand{padding:22px 20px;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-brand .i{color:var(--yellow);font-size:22px}
.side-nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side-link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;font-size:14.5px;font-weight:500;text-align:left}
.side-link .i{font-size:18px}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff}
.side-link.active{background:rgba(251,182,20,.14);color:#fff}
.side-link.active .i{color:var(--yellow)}
.side-foot{margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.side-user{font-size:12.5px;color:#9aa2b4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:10px}
.side-foot .btn{width:100%}

.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h2{font-size:19px;font-weight:800}
.menu-btn{display:none;font-size:22px}
.content{padding:24px 26px 60px}

/* ---------- mobile sidebar ---------- */
@media (max-width:880px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .menu-btn{display:block}
}

/* ---------- dashboard stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.stat .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .val{font-size:26px;font-weight:800;margin-top:6px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}

/* ---------- cards / sections ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.panel-head h3{font-size:16.5px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.two,.three{grid-template-columns:1fr}}

/* ---------- category chips ---------- */
.cat-pick{display:flex;gap:10px;flex-wrap:wrap}
.cat-chip{border:1.5px solid var(--line);border-radius:11px;padding:12px 16px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.cat-chip.on{border-color:var(--ink);background:var(--ink);color:#fff}

/* ---------- checkbox pills ---------- */
.pill-check{display:flex;flex-wrap:wrap;gap:8px}
.pill-check label{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer}
.pill-check input{accent-color:var(--ink)}
.pill-check label:has(input:checked){border-color:var(--ink);background:var(--soft)}

/* ---------- variant rows (grocery) ---------- */
.variant-row{display:grid;grid-template-columns:1fr 130px 36px;gap:8px;margin-bottom:8px}
.variant-presets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip-btn{border:1px dashed #b7bdc9;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-2)}
.chip-btn:hover{border-style:solid;border-color:var(--ink)}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.p-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft)}
.row-name{font-weight:600}
.row-actions{display:flex;gap:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px}
.b-grocery{background:#e4f5e8;color:#166a34}
.b-cosmetics{background:#ffe6ec;color:#be123c}
.b-electronics{background:#e9e7ff;color:#4338ca}
.b-food{background:#fff0dd;color:#b45309}
.b-stock{background:var(--green-soft);color:var(--green)}
.b-oos{background:var(--red-soft);color:var(--red)}
.status-pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.st-Pending{background:#fff4d6;color:#a15c00}
.st-Confirmed{background:var(--blue-soft);color:var(--blue)}
.st-Shipped{background:#e9e7ff;color:#4338ca}
.st-Delivered{background:var(--green-soft);color:var(--green)}
.st-Cancelled{background:var(--red-soft);color:var(--red)}

.empty-msg{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.tabs2{display:flex;gap:8px;flex-wrap:wrap}
.tab2{border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600}
.tab2.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:0 15px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:15px;height:15px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============================== লগইন স্ক্রিন ============================== -->
<div id="loginScreen">
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-mark">🔐</div>
    <h1>এডমিন প্যানেল</h1>
    <p class="sub">আমাদের বাজার - কোটালীপাড়া নিয়ন্ত্রণ করতে লগইন করুন</p>
    <label class="field"><span>ইমেইল</span>
      <input class="input" type="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label class="field"><span>পাসওয়ার্ড</span>
      <input class="input" type="password" id="loginPassword" autocomplete="current-password" required>
    </label>
    <button class="btn btn-dark" type="submit" id="loginBtn">লগইন করুন</button>
    <button type="button" class="login-forgot" id="forgotBtn">পাসওয়ার্ড ভুলে গেছেন?</button>
    <div class="login-error" id="loginError" hidden></div>
  </form>
</div>

<!-- ============================== এডমিন অ্যাপ ============================== -->
<div class="shell" id="app" hidden>
  <div class="sidebar" id="sidebar">
    <div class="side-brand">🛍️ আমাদের বাজার</div>
    <nav class="side-nav" id="sideNav">
      <button class="side-link" data-tab="dashboard">📊<span>ড্যাশবোর্ড</span></button>
      <button class="side-link" data-tab="products">📦<span>পণ্য ব্যবস্থাপনা</span></button>
      <button class="side-link" data-tab="offers">📣<span>অফার / ব্যানার</span></button>
      <button class="side-link" data-tab="orders">🧾<span>অর্ডারসমূহ</span></button>
    </nav>
    <div class="side-foot">
      <div class="side-user" id="sideUserEmail"></div>
      <button class="btn btn-outline" id="logoutBtn">লগ-আউট</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="মেনু">☰</button>
      <h2 id="pageTitle">ড্যাশবোর্ড</h2>
      <span></span>
    </div>

    <div class="content">
      <!-- ---------------- ড্যাশবোর্ড ---------------- -->
      <section data-tab-panel="dashboard">
        <div class="stats" id="statsGrid"></div>
        <div class="panel">
          <div class="panel-head"><h3>সাম্প্রতিক অর্ডার</h3></div>
          <div class="tbl-wrap"><table id="recentOrdersTable"><tbody></tbody></table></div>
        </div>
      </section>

      <!-- ---------------- পণ্য ব্যবস্থাপনা ---------------- -->
      <section data-tab-panel="products" hidden>
        <div class="panel">
          <div class="panel-head">
            <h3 id="productFormTitle">নতুন পণ্য যোগ করুন</h3>
            <button class="btn btn-outline btn-sm" id="cancelEditProduct" hidden>বাতিল করে নতুন করুন</button>
          </div>

          <label class="field" style="margin-top:0"><span>ক্যাটাগরি বাছাই করুন</span></label>
          <div class="cat-pick" id="catPick"></div>
          <p class="hint" id="catHint"></p>

          <form id="productForm">
            <div class="two" style="margin-top:16px">
              <label class="field" style="margin-top:0"><span>পণ্যের নাম *</span>
                <input class="input" id="pName" required placeholder="যেমন: কাটারিভোগ চাল">
              </label>
              <label class="field" style="margin-top:0"><span>ছবির লিংক (URL) *</span>
                <input class="input" id="pImage" required placeholder="https://...">
              </label>
            </div>

            <!-- ক্যাটাগরি-ভিত্তিক ডাইনামিক ফিল্ড এখানে বসবে -->
            <div id="categoryFieldsContainer"></div>

            <div class="two">
              <label class="field" style="margin-top:0"><span>আগের দাম (ছাড় দেখাতে, না থাকলে ফাঁকা)</span>
                <input class="input" type="number" min="0" id="pOldPrice" placeholder="৳">
              </label>
              <label class="field" style="margin-top:0"><span>কোয়ালিটি ট্যাগ (ঐচ্ছিক)</span>
                <input class="input" id="pQuality" placeholder="যেমন: প্রিমিয়াম কোয়ালিটি">
              </label>
            </div>

            <label class="field"><span>বিবরণ (ঐচ্ছিক)</span>
              <textarea class="textarea" id="pDescription" placeholder="পণ্য সম্পর্কে বিস্তারিত লিখুন"></textarea>
            </label>

            <div class="three">
              <label class="field" style="margin-top:0"><span>ব্যাজ (ঐচ্ছিক)</span>
                <select class="select" id="pBadge">
                  <option value="">কোনো ব্যাজ না</option>
                  <option value="নতুন">নতুন</option>
                  <option value="হট">হট</option>
                  <option value="সেরা বিক্রিত">সেরা বিক্রিত</option>
                </select>
              </label>
              <label class="field" style="margin-top:0;justify-content:flex-end"><span>স্টকে আছে</span>
                <div class="pill-check"><label><input type="checkbox" id="pInStock" checked> স্টকে আছে</label></div>
              </label>
              <label class="field" style="margin-top:0;justify-content:flex-end"><span>ফিচার্ড পণ্য</span>
                <div class="pill-check"><label><input type="checkbox" id="pFeatured"> হোমপেজে ফিচার্ড দেখান</label></div>
              </label>
            </div>

            <div style="display:flex;gap:10px;margin-top:18px">
              <button class="btn btn-yellow" type="submit" id="saveProductBtn">পণ্য সংরক্ষণ করুন</button>
            </div>
          </form>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>সব পণ্য (<span id="productCount">0</span>)</h3>
            <div class="tabs2" id="productFilterTabs"></div>
          </div>
          <div class="tbl-wrap"><table id="productsTable"><tbody></tbody></table></div>
        </div>
      </section>

      <!-- ---------------- অফার / ব্যানার ---------------- -->
      <section data-tab-panel="offers" hidden>
        <div class="panel">
          <div class="panel-head">
            <h3 id="offerFormTitle">নতুন অফার যোগ করুন</h3>
            <button class="btn btn-outline btn-sm" id="cancelEditOffer" hidden>বাতিল করে নতুন করুন</button>
          </div>
          <form id="offerForm">
            <label class="field" style="margin-top:0"><span>অফার টেক্সট *</span>
              <input class="input" id="oText" required placeholder="যেমন: ঈদ স্পেশাল অফার - সর্বোচ্চ ৩০% ছাড়!">
            </label>
            <label class="field"><span>ব্যানার ছবির লিংক (ঐচ্ছিক)</span>
              <input class="input" id="oImage" placeholder="https://...">
            </label>
            <label class="field"><span>অফার শেষ হওয়ার সময় (ঐচ্ছিক)</span>
              <input class="input" type="datetime-local" id="oEndsAt">
            </label>
            <div style="display:flex;gap:10px;margin-top:18px">
              <button class="btn btn-yellow" type="submit">অফার সংরক্ষণ করুন</button>
            </div>
          </form>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>চলমান অফারসমূহ</h3></div>
          <div id="offersList"></div>
        </div>
      </section>

      <!-- ---------------- অর্ডারসমূহ ---------------- -->
      <section data-tab-panel="orders" hidden>
        <div class="panel">
          <div class="panel-head">
            <h3>সব অর্ডার (<span id="orderCount">0</span>)</h3>
            <div class="tabs2" id="orderFilterTabs"></div>
          </div>
          <div class="tbl-wrap"><table id="ordersTable"><tbody></tbody></table></div>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="sideOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none"></div>

$("#loginForm").addEventListener("submit", async (e) => {

let allProducts = [], allOffers = [], allOrders = [];
async function loadAll() {
  await Promise.all([loadProducts(), loadOffers(), loadOrders()]);
}
async function loadProducts() {
  const snap = await getDocs(collection(db, "products"));
  allProducts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  renderProductsTable(); renderDashboard();
}
async function loadOffers() {
  const snap = await getDocs(collection(db, "offers"));
  allOffers = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  renderOffersList();
}
async function loadOrders() {
  const snap = await getDocs(collection(db, "orders"));
  allOrders = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
  renderOrdersTable(); renderDashboard();
}

   ========================================================================== */
function renderDashboard() {
  const pending = allOrders.filter((o) => o.status === "Pending").length;
  const delivered = allOrders.filter((o) => o.status === "Delivered");
  const revenue = delivered.reduce((s, o) => s + (Number(o.totalAmount) || 0), 0);
  const oos = allProducts.filter((p) => !p.inStock).length;
  $("#statsGrid").innerHTML = `
    <div class="stat"><div class="lbl">মোট পণ্য</div><div class="val">${fmt(allProducts.length)}</div><div class="sub">${oos} টি স্টকে নেই</div></div>
    <div class="stat"><div class="lbl">পেন্ডিং অর্ডার</div><div class="val">${fmt(pending)}</div><div class="sub">দ্রুত দেখুন ও কনফার্ম করুন</div></div>
    <div class="stat"><div class="lbl">মোট অর্ডার</div><div class="val">${fmt(allOrders.length)}</div><div class="sub">সব সময়ের হিসাব</div></div>
    <div class="stat"><div class="lbl">সম্পন্ন বিক্রি</div><div class="val">৳${fmt(revenue)}</div><div class="sub">"ডেলিভারি সম্পন্ন" অর্ডার থেকে</div></div>`;
  const tb = $("#recentOrdersTable tbody");
  const recent = allOrders.slice(0, 6);
  tb.innerHTML = recent.length ? recent.map((o) => `
    <tr><td class="row-name">${esc(o.productName)}</td><td>${esc(o.customerName || "")}</td>
    <td>৳${fmt(o.totalAmount)}</td><td><span class="status-pill st-${esc(o.status || "Pending")}">${esc(STATUS_LABEL[o.status] || o.status || "পেন্ডিং")}</span></td></tr>`).join("")
    : `<tr><td class="empty-msg">এখনো কোনো অর্ডার আসেনি</td></tr>`;
}

        <select class="select" id="cSizeType">
          <option value="clothing">পোশাক (Free Size / S / M / L / XL)</option>
          <option value="pants">প্যান্ট (কোমরের মাপ)</option>
          <option value="shoes">জুতা (জুতার মাপ)</option>
          <option value="none">সাইজ নেই (কসমেটিক্স আইটেম)</option>

function renderVariantRows() {
  $("#variantRows").innerHTML = groceryVariants.map((v, i) => `

      <button type="button" class="btn btn-danger btn-icon" data-vremove="${i}" aria-label="মুছুন">✕</button>
    </div>`).join("");
  $$("#variantRows [data-vi]").forEach((el) => el.addEventListener("input", (e) => {
    groceryVariants[+el.dataset.vi][el.dataset.vf] = el.value;
  }));
  $$("#variantRows [data-vremove]").forEach((b) => b.addEventListener("click", () => {
    if (groceryVariants.length <= 1) { groceryVariants = [{ label: "", price: "" }]; }
    else groceryVariants.splice(+b.dataset.vremove, 1);
    renderVariantRows();
  }));
}
function renderSizeOptions(selected) {
  const type = $("#cSizeType").value;
  const box = $("#sizeOptionsBox");
  const list = type === "clothing" ? CLOTHING_SIZES : type === "pants" ? PANTS_SIZES : type === "shoes" ? SHOE_SIZES : [];
  if (!list.length) { box.innerHTML = `<p class="hint">এই আইটেমে গ্রাহককে সাইজ বাছাই করতে হবে না।</p>`; return; }
  const sel = new Set(selected || list);
  box.innerHTML = `<label class="field"><span>কোন কোন সাইজ পাওয়া যাচ্ছে (টিক দিন)</span>
    <div class="pill-check">${list.map((s) => `<label><input type="checkbox" value="${esc(s)}" ${sel.has(s)?"checked":""}> ${esc(s)}</label>`).join("")}</div>
  </label>`;
}

function resetProductForm() {
  editingProductId = null;
  $("#productForm").reset();
  $("#pInStock").checked = true;
  $("#productFormTitle").textContent = "নতুন পণ্য যোগ করুন";
  $("#cancelEditProduct").hidden = true;
  currentCategory = "Grocery";
  groceryVariants = [{ label: "", price: "" }];
  renderCatPick(); renderCategoryFields();
}
$("#cancelEditProduct").addEventListener("click", resetProductForm);

$("#productForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#saveProductBtn"); const label = btn.innerHTML;
  btn.innerHTML = `<span class="spin"></span> সংরক্ষণ হচ্ছে...`; btn.disabled = true;

  const base = {
    name: $("#pName").value.trim(),
    imageUrl: $("#pImage").value.trim(),
    category: currentCategory,
    oldPrice: Number($("#pOldPrice").value) || 0,
    quality: $("#pQuality").value.trim(),
    description: $("#pDescription").value.trim(),
    badge: $("#pBadge").value,
    inStock: $("#pInStock").checked,
    featured: $("#pFeatured").checked,
  };

  try {
    if (currentCategory === "Grocery") {
      const variants = groceryVariants.map((v) => ({ label: v.label.trim(), price: Number(v.price) || 0 })).filter((v) => v.label && v.price > 0);
      if (!variants.length) { showToast("অন্তত একটি সঠিক মাপ ও দাম দিন"); btn.innerHTML = label; btn.disabled = false; return; }
      base.groceryUnit = $("#cGroceryUnit").value;
      base.groceryVariants = variants;
      base.price = variants[0].price;
      base.foodPrices = null; base.sizeType = null; base.sizeOptions = null; base.brand = null; base.model = null; base.warranty = null; base.colors = null;
    } else if (currentCategory === "Cosmetics") {
      const price = Number($("#cPrice").value);
      if (!price) { showToast("মূল্য দিন"); btn.innerHTML = label; btn.disabled = false; return; }
      const sizeType = $("#cSizeType").value;
      const sizeOptions = $$("#sizeOptionsBox input:checked").map((i) => i.value);
      base.price = price; base.sizeType = sizeType; base.sizeOptions = sizeOptions;
      base.groceryUnit = null; base.groceryVariants = null; base.foodPrices = null; base.brand = null; base.model = null; base.warranty = null; base.colors = null;
    } else if (currentCategory === "Electronics") {
      const price = Number($("#cPrice").value);
      if (!price) { showToast("মূল্য দিন"); btn.innerHTML = label; btn.disabled = false; return; }
      base.price = price;
      base.brand = $("#cBrand").value.trim();
      base.model = $("#cModel").value.trim();
      base.warranty = $("#cWarranty").value.trim();
      base.colors = $("#cColors").value.split(",").map((c) => c.trim()).filter(Boolean);
      base.groceryUnit = null; base.groceryVariants = null; base.foodPrices = null; base.sizeType = null; base.sizeOptions = null;
    } else if (currentCategory === "Food") {
      const full = Number($("#cFull").value) || 0, half = Number($("#cHalf").value) || 0, piece = Number($("#cPiece").value) || 0;
      if (!full && !half && !piece) { showToast("অন্তত একটি দাম দিন (ফুল/হাফ/পিস)"); btn.innerHTML = label; btn.disabled = false; return; }
      base.foodPrices = { full, half, piece };
      base.price = full || half || piece;
      base.groceryUnit = null; base.groceryVariants = null; base.sizeType = null; base.sizeOptions = null; base.brand = null; base.model = null; base.warranty = null; base.colors = null;
    }

    if (!base.name || !base.imageUrl) { showToast("নাম ও ছবির লিংক আবশ্যক"); btn.innerHTML = label; btn.disabled = false; return; }

    if (editingProductId) await updateDoc(doc(db, "products", editingProductId), base);
    else await addDoc(collection(db, "products"), base);

    showToast(editingProductId ? "পণ্য আপডেট হয়েছে" : "নতুন পণ্য যোগ হয়েছে");
    resetProductForm();
    await loadProducts();
  } catch (err) {
    showToast("সংরক্ষণ করতে সমস্যা হয়েছে, আবার চেষ্টা করুন");
  } finally { btn.innerHTML = label; btn.disabled = false; }
});

function loadProductIntoForm(p) {
  editingProductId = p.id;
  currentCategory = p.category;
  renderCatPick(); renderCategoryFields();
  $("#productFormTitle").textContent = `সম্পাদনা করুন: ${p.name}`;
  $("#cancelEditProduct").hidden = false;
  $("#pName").value = p.name || "";
  $("#pImage").value = p.imageUrl || "";
  $("#pOldPrice").value = p.oldPrice || "";
  $("#pQuality").value = p.quality || "";
  $("#pDescription").value = p.description || "";
  $("#pBadge").value = p.badge || "";
  $("#pInStock").checked = p.inStock !== false;
  $("#pFeatured").checked = !!p.featured;

  if (p.category === "Grocery") {
    groceryVariants = (p.groceryVariants && p.groceryVariants.length) ? p.groceryVariants.map((v) => ({ ...v })) : [{ label: "", price: "" }];
    renderVariantRows();
    if (p.groceryUnit) $("#cGroceryUnit").value = p.groceryUnit;
  } else if (p.category === "Cosmetics") {
    $("#cPrice").value = p.price || "";
    $("#cSizeType").value = p.sizeType || "clothing";
    renderSizeOptions(p.sizeOptions);
  } else if (p.category === "Electronics") {
    $("#cPrice").value = p.price || "";
    $("#cBrand").value = p.brand || "";
    $("#cModel").value = p.model || "";
    $("#cWarranty").value = p.warranty || "";
    $("#cColors").value = (p.colors || []).join(", ");
  } else if (p.category === "Food") {
    const fp = p.foodPrices || {};
    $("#cFull").value = fp.full || "";
    $("#cHalf").value = fp.half || "";
    $("#cPiece").value = fp.piece || "";
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ==========================================================================
   পণ্য তালিকা + ফিল্টার + এডিট/ডিলিট
   ========================================================================== */
let productFilter = "all";
function renderProductFilterTabs() {
  const tabs = [{ key: "all", label: "সব" }, ...CATEGORIES.map((c) => ({ key: c.key, label: c.label }))];
  $("#productFilterTabs").innerHTML = tabs.map((t) => `<button type="button" class="tab2 ${productFilter===t.key?"on":""}" data-pf="${t.key}">${t.label}</button>`).join("");
}
$("#productFilterTabs").addEventListener("click", (e) => { const b = e.target.closest("[data-pf]"); if (!b) return; productFilter = b.dataset.pf; renderProductFilterTabs(); renderProductsTable(); });

function priceLabel(p) {
  if (p.category === "Food" && p.foodPrices) {
    const fp = p.foodPrices;
    const parts = [];
    if (fp.full) parts.push(`ফুল ৳${fmt(fp.full)}`);
    if (fp.half) parts.push(`হাফ ৳${fmt(fp.half)}`);
    if (fp.piece) parts.push(`পিস ৳${fmt(fp.piece)}`);
    return parts.join(" · ") || `৳${fmt(p.price)}`;
  }
  if (p.category === "Grocery" && p.groceryVariants?.length) {
    return p.groceryVariants.map((v) => `${v.label} ৳${fmt(v.price)}`).join(" · ");
  }
  return `৳${fmt(p.price)}`;
}
function renderProductsTable() {
  renderProductFilterTabs();
  const list = productFilter === "all" ? allProducts : allProducts.filter((p) => p.category === productFilter);
  $("#productCount").textContent = allProducts.length;
  const tb = $("#productsTable");
  tb.innerHTML = `<tbody>${
    list.length ? list.map((p) => `
      <tr>
        <td><img class="p-thumb" src="${esc(p.imageUrl)}" alt=""></td>
        <td class="row-name">${esc(p.name)}</td>
        <td><span class="badge ${badgeClass[p.category]||""}">${esc(p.category)}</span></td>
        <td>${esc(priceLabel(p))}</td>
        <td><span class="badge ${p.inStock!==false?"b-stock":"b-oos"}">${p.inStock!==false?"স্টকে আছে":"স্টক শেষ"}</span></td>
        <td>
          <div class="row-actions">
            <button class="btn btn-outline btn-sm" data-edit="${p.id}">এডিট</button>
            <button class="btn btn-outline btn-sm" data-toggle="${p.id}">${p.inStock!==false?"স্টক শেষ করুন":"স্টকে আনুন"}</button>
            <button class="btn btn-danger btn-sm" data-del="${p.id}">মুছুন</button>
          </div>
        </td>
      </tr>`).join("") : `<tr><td class="empty-msg" colspan="6">এই ক্যাটাগরিতে কোনো পণ্য নেই</td></tr>`
  }</tbody>`;
}
$("#productsTable").addEventListener("click", async (e) => {
  const edit = e.target.closest("[data-edit]"); if (edit) { setTab("products"); loadProductIntoForm(allProducts.find((p) => p.id === edit.dataset.edit)); return; }
  const del = e.target.closest("[data-del]");
  if (del) {
    if (!confirm("এই পণ্যটি স্থায়ীভাবে মুছে ফেলতে চান?")) return;
    await deleteDoc(doc(db, "products", del.dataset.del));
    showToast("পণ্য মুছে ফেলা হয়েছে"); await loadProducts(); return;
  }
  const tog = e.target.closest("[data-toggle]");
  if (tog) {
    const p = allProducts.find((x) => x.id === tog.dataset.toggle);
    await updateDoc(doc(db, "products", p.id), { inStock: p.inStock === false });
    await loadProducts();
  }
});

/* ==========================================================================
   অফার / ব্যানার
   ========================================================================== */
let editingOfferId = null;
$("#offerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("#oText").value.trim();
  if (!text) return;
  const data = { text, imageUrl: $("#oImage").value.trim() };
  const endsAtRaw = $("#oEndsAt").value;
  data.endsAt = endsAtRaw ? Timestamp.fromDate(new Date(endsAtRaw)) : null;
  try {
    if (editingOfferId) await updateDoc(doc(db, "offers", editingOfferId), data);
    else await addDoc(collection(db, "offers"), data);
    showToast(editingOfferId ? "অফার আপডেট হয়েছে" : "নতুন অফার যোগ হয়েছে");
    resetOfferForm(); await loadOffers();
  } catch { showToast("সংরক্ষণ করতে সমস্যা হয়েছে"); }
});
function resetOfferForm() {
  editingOfferId = null; $("#offerForm").reset();
  $("#offerFormTitle").textContent = "নতুন অফার যোগ করুন"; $("#cancelEditOffer").hidden = true;
}
$("#cancelEditOffer").addEventListener("click", resetOfferForm);
function renderOffersList() {
  const box = $("#offersList");
  box.innerHTML = allOffers.length ? allOffers.map((o) => `
    <div class="panel" style="margin-bottom:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      ${o.imageUrl ? `<img class="p-thumb" style="width:60px;height:60px" src="${esc(o.imageUrl)}" alt="">` : ""}
      <div style="flex:1;min-width:180px">
        <div class="row-name">${esc(o.text)}</div>
        <div class="hint">${o.endsAt ? "শেষ: " + new Date(o.endsAt.seconds*1000).toLocaleString("bn-BD") : "কোনো সময়সীমা নেই"}</div>
      </div>
      <div class="row-actions">
        <button class="btn btn-outline btn-sm" data-oedit="${o.id}">এডিট</button>
        <button class="btn btn-danger btn-sm" data-odel="${o.id}">মুছুন</button>
      </div>
    </div>`).join("") : `<p class="empty-msg">এখনো কোনো অফার যোগ করা হয়নি</p>`;
}
$("#offersList").addEventListener("click", async (e) => {
  const edit = e.target.closest("[data-oedit]");
  if (edit) {
    const o = allOffers.find((x) => x.id === edit.dataset.oedit);
    editingOfferId = o.id; $("#oText").value = o.text || ""; $("#oImage").value = o.imageUrl || "";
    $("#oEndsAt").value = o.endsAt ? new Date(o.endsAt.seconds*1000).toISOString().slice(0,16) : "";
    $("#offerFormTitle").textContent = "অফার সম্পাদনা করুন"; $("#cancelEditOffer").hidden = false;
    window.scrollTo({ top: 0, behavior: "smooth" }); return;
  }
  const del = e.target.closest("[data-odel]");
  if (del) { if (!confirm("অফারটি মুছে ফেলতে চান?")) return; await deleteDoc(doc(db, "offers", del.dataset.odel)); showToast("অফার মুছে ফেলা হয়েছে"); await loadOffers(); }
});

/* ==========================================================================
   অর্ডারসমূহ
   ========================================================================== */
let orderFilter = "all";
function renderOrderFilterTabs() {
  const tabs = [{ key: "all", label: "সব" }, ...ORDER_STATUSES.map((s) => ({ key: s, label: STATUS_LABEL[s] }))];
  $("#orderFilterTabs").innerHTML = tabs.map((t) => `<button type="button" class="tab2 ${orderFilter===t.key?"on":""}" data-of="${t.key}">${t.label}</button>`).join("");
}
$("#orderFilterTabs").addEventListener("click", (e) => { const b = e.target.closest("[data-of]"); if (!b) return; orderFilter = b.dataset.of; renderOrderFilterTabs(); renderOrdersTable(); });

function renderOrdersTable() {
  renderOrderFilterTabs();
  const list = orderFilter === "all" ? allOrders : allOrders.filter((o) => (o.status || "Pending") === orderFilter);
  $("#orderCount").textContent = allOrders.length;
  $("#ordersTable").innerHTML = `<tbody>${
    list.length ? list.map((o) => `
      <tr>
        <td class="row-name">${esc(o.productName)}</td>
        <td>${esc(o.customerName || "")}<br><span class="hint">${esc(o.customerPhone || "")}</span></td>
        <td style="max-width:220px;white-space:normal">${esc(o.customDetails || "")}<br><span class="hint">${esc(o.customerAddress || "")}</span></td>
        <td>৳${fmt(o.totalAmount)}</td>
        <td>
          <select class="select" style="padding:6px 10px;font-size:12.5px" data-status="${o.id}">
            ${ORDER_STATUSES.map((s) => `<option value="${s}" ${((o.status||"Pending")===s)?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}
          </select>
        </td>
        <td><button class="btn btn-danger btn-sm" data-oorder-del="${o.id}">মুছুন</button></td>
      </tr>`).join("") : `<tr><td class="empty-msg" colspan="6">কোনো অর্ডার পাওয়া যায়নি</td></tr>`
  }</tbody>`;
}
$("#ordersTable").addEventListener("change", async (e) => {
  const sel = e.target.closest("[data-status]"); if (!sel) return;
  await updateDoc(doc(db, "orders", sel.dataset.status), { status: sel.value });
  showToast("অর্ডারের অবস্থা আপডেট হয়েছে"); await loadOrders();
});
$("#ordersTable").addEventListener("click", async (e) => {
  const del = e.target.closest("[data-oorder-del]"); if (!del) return;
  if (!confirm("অর্ডারটি স্থায়ীভাবে মুছে ফেলতে চান?")) return;
  await deleteDoc(doc(db, "orders", del.dataset.oorderDel));
  showToast("অর্ডার মুছে ফেলা হয়েছে"); await loadOrders();
});

/* ==========================================================================
   ইনিট
   ========================================================================== */
renderCatPick();
renderCategoryFields();
</script>
</body>
</html>
